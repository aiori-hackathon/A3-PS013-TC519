<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTrace - Analyst Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CyberTrace Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body" data-page="login">

    <div class="login-card">
        <div class="login-header">
            <h3><i class="bi bi-shield-lock-fill text-primary"></i> CyberTrace</h3>
            <p>Cyber Threat Intelligence & Incident Correlation Platform</p>
        </div>
        <div class="login-body-content">
            <div id="loginAlert" class="alert alert-danger py-2 small d-none" role="alert"></div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-muted">Analyst Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="e.g. admin" value="admin" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" value="cybertrace" required>
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                    <label class="form-check-label small text-muted" for="rememberMe">Remember analyst session</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In to Portal
                </button>
            </form>

            <div class="mt-4 text-center">
                <small class="text-muted d-block">
                    <i class="bi bi-info-circle"></i> Second-Year Undergraduate DBMS Academic Project
                </small>
                <small class="text-muted">Demonstration Credentials: <code>admin / cybertrace</code></small>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom CyberTrace Script -->
    <script src="js/script.js"></script>
</body>
</html>
